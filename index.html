<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>足球員踢球運筆遊戲</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            touch-action: none; 
            background: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif; 
        }
        /* 固定遊戲容器比例，防止變形與隨意縮放 */
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (1414 / 2000)); /* 鎖定背景 1414x2000 的比例 */
            max-height: calc(100vw * (2000 / 1414));
            background: #fff;
            overflow: hidden;
        }
        #gameCanvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }
        #stars { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            font-size: 28px; 
            color: #FFD700; 
            z-index: 10; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
        }
        #winScreen { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(255, 255, 255, 0.9); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
            font-size: 4em; 
            color: #FF4500; 
            font-weight: bold; 
        }
        #replayBtn { 
            position: absolute; 
            bottom: 60px; 
            left: 50%; 
            transform: translateX(-50%); 
            padding: 20px 40px; 
            font-size: 24px; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 15px; 
            display: none; 
            z-index: 101; 
            cursor: pointer; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="stars">☆☆☆☆☆</div>
        <div id="winScreen">✨ 你真努力！</div>
        <button id="replayBtn">再玩一次</button>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const winScreen = document.getElementById('winScreen');
        const replayBtn = document.getElementById('replayBtn');
        const starsEl = document.getElementById('stars');
        
        let score = 0;
        let isDrawing = false;
        let path = [];
        
        // 設定內部邏輯解析度 (配合 1414 x 2000 比例)
        const LOGICAL_WIDTH = 1414;
        const LOGICAL_HEIGHT = 2000;
        canvas.width = LOGICAL_WIDTH;
        canvas.height = LOGICAL_HEIGHT;

        // 定位座標 (依據 1414x2000 畫布)
        // 讓球員在左上方，踢出方向往右下方龍門
        const playerPos = { x: 150, y: 150 };
        const ballStartPos = { x: 320, y: 380 };      // 位於球員腳尖上方
        const goalCenter = { x: 800, y: 1350 };       // 位於畫面中下方的龍門內

        // 載入圖片
        const bg = new Image(); bg.src = '19.png';
        const player = new Image(); player.src = 'player.png';
        const rawBall = new Image(); rawBall.src = 'football.png';

        // 建立退底去背景後的足球 Canvas 暫存圖
        let processedBallCanvas = document.createElement('canvas');
        let ballReady = false;

        rawBall.onload = () => {
            processedBallCanvas.width = rawBall.width;
            processedBallCanvas.height = rawBall.height;
            let pCtx = processedBallCanvas.getContext('2d');
            pCtx.drawImage(rawBall, 0, 0);
            
            // 取得像素並將白色 (接近 255,255,255) 轉為透明
            let imgData = pCtx.getImageData(0, 0, processedBallCanvas.width, processedBallCanvas.height);
            let data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i], g = data[i+1], b = data[i+2];
                // 如果背景是白色或極淺灰色，將 Alpha 通道設為 0
                if (r > 200 && g > 200 && b > 200) {
                    data[i+3] = 0;
                }
            }
            pCtx.putImageData(imgData, 0, 0);
            ballReady = true;
            draw();
        };

        // 確保全部圖片載入後重新繪製
        let loadedImages = 0;
        function checkLoaded() {
            loadedImages++;
            if (loadedImages >= 2) draw();
        }
        bg.onload = checkLoaded;
        player.onload = checkLoaded;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. 繪製背景
            ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
            
            // 2. 繪製球員 (可依需求調整大小，原圖 704x914)
            ctx.drawImage(player, playerPos.x, playerPos.y, 450, 580);
            
            // 3. 繪製半透明引導道路
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 70;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(ballStartPos.x, ballStartPos.y);
            ctx.lineTo(goalCenter.x, goalCenter.y);
            ctx.stroke();

            // 4. 起點白圓點
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(ballStartPos.x, ballStartPos.y, 45, 0, Math.PI * 2);
            ctx.fill();

            // 5. 終點閃爍黃色圓形提示 (利用時間產生呼吸燈大小與透明度變化)
            let pulse = Math.sin(Date.now() / 200) * 8 + 45;
            let alphaPulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(255, 215, 0, ${alphaPulse})`;
            ctx.beginPath();
            ctx.arc(goalCenter.x, goalCenter.y, pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#FFA500';
            ctx.lineWidth = 6;
            ctx.stroke();

            // 6. 繪製玩家運筆的實線
            if (path.length > 0) {
                ctx.strokeStyle = '#1E90FF'; // 使用亮藍色或黑色讓 K2 小朋友看清楚
                ctx.lineWidth = 35;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                for (let p of path) ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }

            // 7. 繪製足球 (已去背景)
            if (ballReady) {
                let currentBallPos = ballStartPos;
                if (isDrawing && path.length > 0) {
                    currentBallPos = path[path.length - 1];
                }
                let ballSize = 120;
                ctx.drawImage(processedBallCanvas, currentBallPos.x - ballSize/2, currentBallPos.y - ballSize/2, ballSize, ballSize);
            }
        }

        // 動畫循環（讓終點黃色圓圈持續閃爍）
        function animate() {
            draw();
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        // 座標轉換函數（將螢幕觸控點對應至固定比例的邏輯畫布）
        function getCanvasCoord(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        // 觸控與滑鼠事件處理
        function startDrag(e) {
            let pos = getCanvasCoord(e);
            // 判斷是否點擊在起點球的附近範圍
            if (Math.hypot(pos.x - ballStartPos.x, pos.y - ballStartPos.y) < 90) {
                isDrawing = true;
                path = [pos];
            }
        }

        function moveDrag(e) {
            if (!isDrawing) return;
            let pos = getCanvasCoord(e);
            path.push(pos);

            // 檢查是否到達終點龍門範圍
            if (Math.hypot(pos.x - goalCenter.x, pos.y - goalCenter.y) < 70) {
                win();
            }
        }

        function endDrag() {
            if (isDrawing) {
                isDrawing = false;
                path = []; // 放開後若未完成則重置軌跡
            }
        }

        canvas.addEventListener('pointerdown', startDrag);
        canvas.addEventListener('pointermove', moveDrag);
        canvas.addEventListener('pointerup', endDrag);

        function win() {
            isDrawing = false;
            score++;
            winScreen.style.display = 'flex';
            setTimeout(() => {
                winScreen.style.display = 'none';
                updateStars();
                path = [];
            }, 1500);
        }

        function updateStars() {
            let s = "";
            for (let i = 0; i < 5; i++) s += (i < score) ? "★" : "☆";
            starsEl.innerText = s;
            if (score >= 5) {
                replayBtn.style.display = 'block';
            }
        }

        replayBtn.onclick = () => {
            score = 0;
            updateStars();
            replayBtn.style.display = 'none';
            path = [];
        };
    </script>
</body>
</html>
