<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>足球員踢球運筆遊戲</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            touch-action: none; 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        #gameContainer { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            max-width: calc(100vh * (1414 / 2000)); 
            max-height: calc(100vw * (2000 / 1414)); 
            background: #fff; 
            overflow: hidden; 
        }
        #gameCanvas { display: block; width: 100%; height: 100%; }
        #stars { position: absolute; top: 20px; left: 20px; font-size: 28px; color: #FFD700; z-index: 10; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        #winScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); display: none; justify-content: center; align-items: center; z-index: 100; font-size: 4em; color: #FF4500; font-weight: bold; }
        #replayBtn { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); padding: 20px 40px; font-size: 24px; background: #4CAF50; color: white; border: none; border-radius: 15px; display: none; z-index: 101; cursor: pointer; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="stars">☆☆☆☆☆</div>
        <div id="winScreen">✨ 你真努力！</div>
        <button id="replayBtn">再玩一次</button>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const winScreen = document.getElementById('winScreen');
        const replayBtn = document.getElementById('replayBtn');
        const starsEl = document.getElementById('stars');
        
        let score = 0;
        let isDrawing = false;
        let path = [];
        
        const LOGICAL_WIDTH = 1414;
        const LOGICAL_HEIGHT = 2000;
        canvas.width = LOGICAL_WIDTH;
        canvas.height = LOGICAL_HEIGHT;

        // 依據圖片紅圈精確調整的座標：
        // 球員位置在左下方
        const playerPos = { x: 120, y: 580 };
        // 起點：剛好對準球員踢出的腳尖位置
        const ballStartPos = { x: 340, y: 670 };      
        // 終點：延伸至龍門網內的位置
        const goalCenter = { x: 670, y: 520 };        

        const bg = new Image(); bg.src = '19.png';
        const player = new Image(); player.src = 'player.png';
        const rawBall = new Image(); rawBall.src = 'football.png';

        let processedBallCanvas = document.createElement('canvas');
        let ballReady = false;

        rawBall.onload = () => {
            processedBallCanvas.width = rawBall.width;
            processedBallCanvas.height = rawBall.height;
            let pCtx = processedBallCanvas.getContext('2d');
            pCtx.drawImage(rawBall, 0, 0);
            let imgData = pCtx.getImageData(0, 0, processedBallCanvas.width, processedBallCanvas.height);
            let data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                if (data[i] > 200 && data[i+1] > 200 && data[i+2] > 200) data[i+3] = 0;
            }
            pCtx.putImageData(imgData, 0, 0);
            ballReady = true;
            draw();
        };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
            ctx.drawImage(player, playerPos.x, playerPos.y, 450, 580);
            
            // 引導路徑
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 70;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(ballStartPos.x, ballStartPos.y);
            ctx.lineTo(goalCenter.x, goalCenter.y);
            ctx.stroke();

            // 閃爍黃色目標點（龍門內）
            let pulse = Math.sin(Date.now() / 200) * 8 + 45;
            ctx.fillStyle = `rgba(255, 215, 0, 0.8)`;
            ctx.beginPath();
            ctx.arc(goalCenter.x, goalCenter.y, pulse, 0, Math.PI * 2);
            ctx.fill();

            // 玩家運筆實線
            if (path.length > 0) {
                ctx.strokeStyle = '#1E90FF';
                ctx.lineWidth = 35;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                for (let p of path) ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }

            // 足球
            if (ballReady) {
                let p = isDrawing ? path[path.length - 1] : ballStartPos;
                let ballSize = 240;
                ctx.drawImage(processedBallCanvas, p.x - ballSize/2, p.y - ballSize/2, ballSize, ballSize);
            }
        }

        function animate() { draw(); requestAnimationFrame(animate); }
        animate();

        function getCoord(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
        }

        canvas.addEventListener('pointerdown', (e) => {
            let p = getCoord(e);
            if (Math.hypot(p.x - ballStartPos.x, p.y - ballStartPos.y) < 140) isDrawing = true, path = [p];
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            let p = getCoord(e);
            path.push(p);
            if (Math.hypot(p.x - goalCenter.x, p.y - goalCenter.y) < 80) win();
        });

        canvas.addEventListener('pointerup', () => { isDrawing = false; path = []; });

        function win() {
            isDrawing = false; score++; winScreen.style.display = 'flex';
            setTimeout(() => { winScreen.style.display = 'none'; updateStars(); path = []; }, 1500);
        }

        function updateStars() {
            starsEl.innerText = "★".repeat(score) + "☆".repeat(5 - score);
            if (score >= 5) replayBtn.style.display = 'block';
        }

        replayBtn.onclick = () => { score = 0; updateStars(); replayBtn.style.display = 'none'; };
    </script>
</body>
</html>
